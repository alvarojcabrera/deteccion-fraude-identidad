seed: 42

paths:
  raw: data/raw/data_anonymized.csv
  processed: data/processed
  sample: data/sample
  models: models
  reports: reports
  logs: logs

columns:
  id: PROCESS_ID
  account: ACCOUNT_ID
  date: DATE
  target: IS_FRAUD

# Hallazgo 1: misma señal con distinto nombre según el cliente
unify:
  DISTRUST_U: [DISTRUST, Distrust]
  ANOMALY_U: [ANOMALY, Anomaly]
  LIFETIME_U: [LIFETIME, Lifetime]

# Nombre legible de cada cliente; un cliente no listado queda como "otro"
clients:
  6016f351bf654d3ffc2369bb405650b62ad5ea5bc89e4b4679e81dfc699ceca2: A
  eb9ccb5926fb6be3dec983ca05b550807f2ada4edfff205eebbf8a82f24750fa: B

# Columnas de identidad -> nombre corto para las variables derivadas
identity:
  DOCUMENT_NUMBER: documento
  EMAIL: email
  PHONE_NUMBER: telefono

# Historial de intentos y fallos por identidad, en cualquier cuenta
identity_history:
  DOCUMENT_NUMBER: documento
  EMAIL: email

# Motivos de rechazo asociados a fraude (EDA §10). Se cuentan en intentos ANTERIORES (S12).
# Depende de la taxonomía del proveedor de verificación: si cambia, hay que actualizarla (S15).
risk_reasons:
  - portrait_photo_is_fake
  - possible_fraud
  - fraudster_face_match_in_client_collection
  - document_is_a_photo_of_photo
  - document_is_a_photocopy
  - front_side_document_is_a_photocopy
  - reverse_side_document_is_a_photocopy
  - image_face_validation_not_passed

# S10: meses del cliente A en que solo se guardaron fraudes (100 % de fraude, EDA §6).
# Cuentan como historial para las variables, pero no se usan para entrenar ni evaluar.
biased_periods:
  A: ["2023-11", "2023-12", "2024-01", "2024-03", "2024-04"]

features:
  numeric:
    - DISTRUST_U
    - ANOMALY_U
    - LIFETIME_U
    - intentos_previos
    - fallos_previos
    - tasa_fallos_previos
    - rechazos_riesgo_previos
    - horas_desde_intento_anterior
    - intentos_24h
    - cuentas_previas_documento
    - cuentas_previas_email
    - cuentas_previas_telefono
    - intentos_previos_documento
    - fallos_previos_documento
    - intentos_previos_email
    - fallos_previos_email
    - falta_documento
    - falta_email
    - falta_telefono
    - falta_distrust
    - falta_lifetime
  # CLIENTE queda fuera: no aporta (ablación en Fase 3) y así el modelo sirve para clientes nuevos.
  # Se conserva en los datos para estratificar, evaluar y monitorear por cliente.
  categorical:
    - DOCUMENT_TYPE
  # S3: resultado de la verificación; solo para la variante comparativa
  leakage:
    - STATUS
    - DECLINED_REASON

# Documentación de lo que NO entra al modelo y por qué
excluded:
  identificadores: [PROCESS_ID, VISITOR_ID, URL, REQUEST_ID, RequestId, IP_ADDRESS, CLIENT_ID]
  constantes: [ENVIRONMENT, Advice, CommonBehavior]
  redundantes: [PROCESS_DATE, FirstTime]
  ruido_sintetico: [COUNTRY_CODE, COUNTRY_NAME, CITY_NAME, POSTAL_CODE, LATITUDE, LONGITUDE,
                    TIMEZONE, TIMEZONE_MISMATCH, DEVICE, BROWSER_NAME, BROWSER_VERSION, OS,
                    OS_VERSION, OS_MISMATCH, INCOGNITO, PUBLIC_VPN, RELAY, VPN_RESULT,
                    VPN_CONFIDENCE, VISITOR_FOUND, VELOCITY_DISTINCT_IP_5M,
                    VELOCITY_DISTINCT_IP_1H, VELOCITY_DISTINCT_IP_24H, SUSPECT_SCORE,
                    CONFIDENCE_SCORE, FIRST_SEEN_GLOBAL, FIRST_SEEN_SUBSCRIPTION]
  baja_cobertura: [SimCardChange, Operator, ChangedInLastSevenDays,
                   ElapsedTimeDays, ElapsedTimeHours]

split:
  n_folds: 5

training:
  cv_folds: 5
  # Recall a una tasa de falsos positivos fija: cuánto fraude se detecta molestando al 5 % de legítimos
  target_fpr: 0.05
  # Sin ponderar clases: 17,7 % de fraude es un desbalance moderado y la ponderación
  # distorsiona las probabilidades que usa la lógica de decisión (Fase 5).
  models:
    logistic:
      C: 1.0
      max_iter: 2000
    # num_leaves y min_child_samples salieron de una búsqueda de 6 combinaciones: todas quedaron
    # en un rango de 0,004 de PR-AUC, así que se eligió la más simple (árboles pequeños)
    lightgbm:
      n_estimators: 400
      learning_rate: 0.03
      num_leaves: 7
      min_child_samples: 100
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      verbose: -1
  # Restricciones monótonas (LightGBM): +1 = el riesgo nunca baja si la variable sube;
  # −1 = nunca sube. Sin ellas, en el 99 % de los casos había algún tramo donde más DISTRUST
  # daba MENOS riesgo: imposible de defender ante un analista. Con ellas el PR-AUC no cambia.
  monotone:
    DISTRUST_U: 1
    LIFETIME_U: -1
    fallos_previos: 1
    rechazos_riesgo_previos: 1
    cuentas_previas_documento: 1
    cuentas_previas_email: 1
    cuentas_previas_telefono: 1
    fallos_previos_documento: 1
    fallos_previos_email: 1
  # Comparaciones (ablación). "principal" es el modelo que se guarda.
  experiments:
    principal: {model: lightgbm}
    linea_base: {model: logistic}
    con_fuga: {model: lightgbm, add: [STATUS, DECLINED_REASON]}
    sin_distrust: {model: lightgbm, drop: [DISTRUST_U, falta_distrust]}
    # Variables originales de la Fase 3, para medir el aporte del feature engineering
    sin_variables_nuevas:
      model: lightgbm
      drop: [tasa_fallos_previos, rechazos_riesgo_previos, intentos_24h,
             intentos_previos_documento, fallos_previos_documento,
             intentos_previos_email, fallos_previos_email]

# Decisión por costo esperado mínimo (Fase 5). El modelo da una probabilidad calibrada;
# los costos solo mueven los umbrales, así que cambiarlos no requiere reentrenar.
decision:
  # S6: costos relativos, en unidades de "pérdida por un fraude aprobado" = 1.
  # Rechazar a un cliente bueno se asume 2 veces más caro (LTV y costo de adquisición perdidos).
  # Es un supuesto de negocio: reports/sensibilidad_costos.csv muestra cómo cambia todo con él.
  costs:
    fraude_aprobado: 1.0
    legitimo_rechazado: 2.0
  # S14: verificación adicional en la zona gris (OTP, nueva selfie o revisión de un analista)
  step_up:
    costo: 0.05              # costo operativo y de fricción por caso verificado
    abandono_legitimos: 0.10 # % de clientes buenos que abandonan ante la verificación
    captura_fraude: 0.70     # % de fraudes que la verificación detiene
  # Escenarios del análisis de sensibilidad: costo de rechazar a un bueno / costo de un fraude
  sensitivity: [0.1, 0.5, 1, 2, 5]

# Explicación de cada decisión: las variables que más empujaron hacia fraude, en lenguaje legible
explanations:
  top_k: 3
  # En una aprobación los motivos no aportan (el riesgo es bajo): solo se explican estas
  decisiones: [verificar, rechazar]
  # Solo variables con aporte relevante (en log-odds) se presentan como motivo
  min_contribucion: 0.05
  nombres:
    DISTRUST_U: Desconfianza del proveedor de verificación
    ANOMALY_U: Anomalía detectada por el proveedor
    LIFETIME_U: Antigüedad del teléfono (días)
    DOCUMENT_TYPE: Tipo de documento
    intentos_previos: Intentos previos de la cuenta
    fallos_previos: Verificaciones fallidas previas de la cuenta
    tasa_fallos_previos: Proporción de intentos previos fallidos
    rechazos_riesgo_previos: Rechazos previos por señales de fraude
    horas_desde_intento_anterior: Horas desde el intento anterior
    intentos_24h: Intentos de la cuenta en las últimas 24 h
    cuentas_previas_documento: Otras cuentas que usaron el mismo documento
    cuentas_previas_email: Otras cuentas que usaron el mismo email
    cuentas_previas_telefono: Otras cuentas que usaron el mismo teléfono
    intentos_previos_documento: Intentos previos con el mismo documento
    fallos_previos_documento: Fallos previos con el mismo documento
    intentos_previos_email: Intentos previos con el mismo email
    fallos_previos_email: Fallos previos con el mismo email
    falta_documento: Sin número de documento
    falta_email: Sin email
    falta_telefono: Sin teléfono
    falta_distrust: Sin puntaje de desconfianza
    falta_lifetime: Sin antigüedad del teléfono

monitoring:
  psi_bins: 10
  psi_alert: 0.25
  # Alerta si la tasa de una decisión se aleja más de esto (en puntos) de lo esperado
  decision_rate_tolerance: 0.05
  # Mínimo de etiquetas maduras para calcular métricas de desempeño
  min_labels: 50
